<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiARSIP — Kelola Akun</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0E7B62;--teal2:#16A884;--navy:#0B1D35;--gold:#C9973A;--red:#DC2626;--light:#EEF2F8;--white:#fff;--border:#E2E8F0;--text1:#0B1D35;--text2:#4A5568;--text3:#94A3B8}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--light);display:flex;height:100vh;overflow:hidden}
.sb{width:230px;background:linear-gradient(180deg,#0B1D35,#0E2646);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow-y:auto;scrollbar-width:none}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sb-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:flex;align-items:center;justify-content:center;font-size:18px}
.sb-appname{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;color:#fff;letter-spacing:1px}
.sb-inst{font-size:9px;color:rgba(255,255,255,.28);text-transform:uppercase;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.sb-sec{font-size:9px;font-weight:800;color:rgba(255,255,255,.2);letter-spacing:1.3px;text-transform:uppercase;padding:10px 14px 4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 8px;border-radius:9px;cursor:pointer;color:rgba(255,255,255,.42);font-size:12.5px;font-weight:500;transition:all .15s;border-left:2px solid transparent;text-decoration:none}
.sb-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.75)}
.sb-item.on{background:rgba(14,123,98,.2);color:#34D399;font-weight:700;border-left-color:var(--teal)}
.sb-emo{font-size:15px;flex-shrink:0}
.sb-logout{margin:8px;padding:9px 12px;border-radius:9px;cursor:pointer;color:rgba(255,255,255,.35);font-size:12px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.06);background:none;width:calc(100% - 16px);font-family:inherit}
.sb-logout:hover{background:rgba(220,38,38,.15);color:#FCA5A5}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-ttl{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;color:var(--navy)}
.page-sub{font-size:11px;color:var(--text3);margin-top:2px}
.btn-green{display:flex;align-items:center;gap:6px;padding:9px 18px;background:linear-gradient(135deg,var(--teal),var(--teal2));border:none;border-radius:10px;color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:16px 22px}
.card{background:var(--white);border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.akun-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #F7F9FB}
.akun-row:last-child{border-bottom:none}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.akun-info{flex:1}
.akun-nm{font-size:13px;font-weight:700;color:var(--navy)}
.akun-meta{font-size:10.5px;color:var(--text3);margin-top:2px}
.level-chip{font-size:9.5px;padding:3px 10px;border-radius:100px;font-weight:800}
.status-chip{font-size:9.5px;padding:2px 8px;border-radius:100px;font-weight:700}
.akun-actions{display:flex;gap:6px;flex-shrink:0}
.btn-sm{padding:5px 10px;border-radius:7px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--text2)}
.btn-sm:hover{background:var(--light)}
.btn-sm.red{border-color:#FECACA;color:var(--red)}
.btn-sm.red:hover{background:#FEE2E2}
.skel{background:linear-gradient(90deg,#F0F4F8 25%,#E2E8F0 50%,#F0F4F8 75%);background-size:200% 100%;animation:skel 1.5s infinite;border-radius:8px;height:14px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:20px;padding:28px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-ttl{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:16px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:10px;font-weight:800;color:var(--text2);letter-spacing:.9px;text-transform:uppercase;margin-bottom:6px}
.fg input,.fg select{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:13.5px;color:var(--text1);background:#FAFBFD;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--teal)}
.modal-btns{display:flex;gap:10px;margin-top:4px}
.modal-btns button{flex:1;padding:11px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none}
.btn-batal-m{background:#F1F4F9;color:var(--text2)}
.btn-simpan-m{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}
</style>
</head>
<body>
<div class="sb">
  <div class="sb-brand">
    <div class="sb-logo-row"><div class="sb-logo">🗃️</div><div><div class="sb-appname" id="sbAppName">SiARSIP</div><div class="sb-inst" id="sbInstName">—</div></div></div>
  </div>
  <div class="sb-sec">MENU UTAMA</div>
  <a class="sb-item" href="dashboard.html"><span class="sb-emo">⊞</span>Dashboard</a>
  <a class="sb-item" href="arsip.html"><span class="sb-emo">🗂️</span>Semua Berkas</a>
  <a class="sb-item" href="input.html"><span class="sb-emo">➕</span>Input Dokumen</a>
  <div class="sb-sec">PENGELOLAAN</div>
  <a class="sb-item" href="arsip.html?rahasia=YA"><span class="sb-emo">🔒</span>Dok. Rahasia</a>
  <a class="sb-item on" href="akun.html"><span class="sb-emo">👥</span>Kelola Akun</a>
  <a class="sb-item" href="log.html"><span class="sb-emo">📜</span>Log Aktivitas</a>
  <a class="sb-item" href="pengaturan.html"><span class="sb-emo">⚙️</span>Pengaturan</a>
  <div style="margin-top:auto;padding:8px"><button class="sb-logout" onclick="SIARSIP.hapusSesi();window.location.href='index.html'">🚪 &nbsp;Keluar</button></div>
</div>

<div class="main">
  <div class="topbar">
    <div><div class="page-ttl">Kelola Akun</div><div class="page-sub">Manajemen pengguna dan hak akses sistem</div></div>
    <button class="btn-green" onclick="bukaModalTambah()">➕ &nbsp;Tambah Akun</button>
  </div>
  <div class="content">
    <div class="card" id="akunCard">
      <div style="padding:20px"><div class="skel" style="margin-bottom:12px"></div><div class="skel" style="margin-bottom:12px;width:80%"></div><div class="skel" style="width:60%"></div></div>
    </div>
  </div>
</div>

<!-- Modal Tambah Akun -->
<div class="modal-bg" id="modalTambah">
  <div class="modal">
    <div class="modal-ttl">➕ Tambah Akun Baru</div>
    <div class="fg"><label>Nama Lengkap *</label><input id="aNama" placeholder="Nama lengkap pengguna"></div>
    <div class="fg"><label>Username *</label><input id="aUser" placeholder="username (tanpa spasi)"></div>
    <div class="fg"><label>Password *</label><input id="aPass" type="password" placeholder="Minimal 8 karakter"></div>
    <div class="fg"><label>Email</label><input id="aEmail" type="email" placeholder="email@instansi.com"></div>
    <div class="fg"><label>Divisi</label>
      <select id="aDivisi"><option>Umum</option><option>HRD</option><option>Keuangan</option><option>Operasional</option><option>Teknik</option></select>
    </div>
    <div class="fg"><label>Level Akses *</label>
      <select id="aLevel">
        <option value="TOKEN">Akses Token (Staf Umum)</option>
        <option value="PENUH">Akses Penuh (Kepala / Pimpinan)</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn-batal-m" onclick="tutupModal('modalTambah')">Batal</button>
      <button class="btn-simpan-m" onclick="tambahAkun()">Simpan Akun</button>
    </div>
  </div>
</div>

<!-- Modal Ubah Level -->
<div class="modal-bg" id="modalLevel">
  <div class="modal">
    <div class="modal-ttl">🔄 Ubah Level Akses</div>
    <div class="fg"><label>Akun</label><input id="lNama" readonly style="background:#F4F7FB"></div>
    <div class="fg"><label>Level Akses Baru</label>
      <select id="lLevel">
        <option value="TOKEN">Akses Token (Staf Umum)</option>
        <option value="PENUH">Akses Penuh (Kepala / Pimpinan)</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn-batal-m" onclick="tutupModal('modalLevel')">Batal</button>
      <button class="btn-simpan-m" onclick="ubahLevel()">Simpan</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const sesi = SIARSIP.cekLogin();
if(sesi.levelAkses!=='ADMIN'){SIARSIP.toast('Hanya admin','error');window.location.href='dashboard.html';}
let akunTarget = null;

async function loadKonfig(){const k=await SIARSIP.get({action:'konfig_publik'});if(k.namaInstansi)document.getElementById('sbInstName').textContent=k.namaInstansi;if(k.namaAplikasi)document.getElementById('sbAppName').textContent=k.namaAplikasi;}
loadKonfig();

const levelStyle = {
  'ADMIN':{bg:'#FEF3C7',c:'#92400E',lbl:'Administrator'},
  'PENUH':{bg:'#EDE9FE',c:'#6D28D9',lbl:'Akses Penuh'},
  'TOKEN':{bg:'#E0F4EF',c:'#0E7B62',lbl:'Akses Token'},
};
const avColors = ['#0E7B62','#1E40AF','#6D28D9','#B45309','#DC2626','#065F46'];

async function muat() {
  const h = await SIARSIP.post('semuaAkun',{idAdmin:sesi.idAkun});
  const el = document.getElementById('akunCard');
  if(!h.sukses){el.innerHTML=`<div style="padding:20px;color:var(--red)">${h.pesan}</div>`;return;}

  el.innerHTML = h.akuns.map((a,i)=>{
    const lv = levelStyle[a.levelAkses]||{bg:'#F1F5F9',c:'#64748B',lbl:a.levelAkses};
    const av = avColors[i%avColors.length];
    const inisial = a.nama.split(' ').map(w=>w[0]).join('').substr(0,2).toUpperCase();
    const aktif = a.status==='AKTIF';
    return `<div class="akun-row">
      <div class="av" style="background:${av};color:#fff">${inisial}</div>
      <div class="akun-info">
        <div class="akun-nm">${a.nama}</div>
        <div class="akun-meta">@${a.username} · ${a.divisi} · Login: ${a.terakhirLogin?SIARSIP.formatWaktu(a.terakhirLogin):'Belum pernah'}</div>
      </div>
      <span class="level-chip" style="background:${lv.bg};color:${lv.c}">${lv.lbl}</span>
      <span class="status-chip" style="background:${aktif?'#D1FAE5':'#FEE2E2'};color:${aktif?'#065F46':'var(--red)'}">${aktif?'Aktif':'Nonaktif'}</span>
      ${a.levelAkses!=='ADMIN'?`
      <div class="akun-actions">
        <button class="btn-sm" onclick='bukaModalLevel(${JSON.stringify(a)})'>🔄 Level</button>
        <button class="btn-sm" onclick="resetPass('${a.idAkun}','${a.nama}')">🔑 Reset</button>
        <button class="btn-sm red" onclick="hapus('${a.idAkun}','${a.nama}')">✕</button>
      </div>`:'<div style="font-size:11px;color:var(--text3);padding:0 6px">—</div>'}
    </div>`;
  }).join('');
}
muat();

function bukaModalTambah(){document.getElementById('modalTambah').classList.add('show');}
function tutupModal(id){document.getElementById(id).classList.remove('show');}

function bukaModalLevel(a){
  akunTarget = a;
  document.getElementById('lNama').value  = `${a.nama} (@${a.username})`;
  document.getElementById('lLevel').value = a.levelAkses;
  document.getElementById('modalLevel').classList.add('show');
}

async function tambahAkun(){
  const data = {namaLengkap:document.getElementById('aNama').value,username:document.getElementById('aUser').value,password:document.getElementById('aPass').value,email:document.getElementById('aEmail').value,divisi:document.getElementById('aDivisi').value,levelAkses:document.getElementById('aLevel').value};
  if(!data.namaLengkap||!data.username||!data.password){SIARSIP.toast('Isi semua kolom wajib','error');return;}
  const h = await SIARSIP.post('tambahAkun',{data,idAdmin:sesi.idAkun});
  tutupModal('modalTambah');
  SIARSIP.toast(h.pesan||(h.sukses?'Akun berhasil dibuat':'Gagal'),h.sukses?'sukses':'error');
  if(h.sukses) muat();
}

async function ubahLevel(){
  if(!akunTarget) return;
  const h = await SIARSIP.post('ubahLevelAkses',{idAkunTarget:akunTarget.idAkun,levelBaru:document.getElementById('lLevel').value,idAdmin:sesi.idAkun});
  tutupModal('modalLevel');
  SIARSIP.toast(h.pesan||(h.sukses?'Level berhasil diubah':'Gagal'),h.sukses?'sukses':'error');
  if(h.sukses) muat();
}

async function resetPass(id, nama){
  const pw = prompt(`Reset password untuk ${nama}.\nMasukkan password baru (min 8 karakter):`);
  if(!pw||pw.length<8){if(pw!==null)SIARSIP.toast('Password min 8 karakter','error');return;}
  const h = await SIARSIP.post('resetPassword',{idAkunTarget:id,passwordBaru:pw,idAdmin:sesi.idAkun});
  SIARSIP.toast(h.pesan||(h.sukses?'Password direset':'Gagal'),h.sukses?'sukses':'error');
}

async function hapus(id, nama){
  if(!confirm(`Nonaktifkan akun "${nama}"?\nAkun tidak bisa login setelah dinonaktifkan.`)) return;
  const h = await SIARSIP.post('hapusAkun',{idAkunTarget:id,idAdmin:sesi.idAkun});
  SIARSIP.toast(h.pesan||(h.sukses?'Akun dinonaktifkan':'Gagal'),h.sukses?'sukses':'error');
  if(h.sukses) muat();
}
</script>
</body>
</html>
